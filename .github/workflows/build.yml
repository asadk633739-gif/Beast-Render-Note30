name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Permission
      run: chmod +x gradlew
    - name: Build
      run: ./gradlew build
    - name: Upload
      uses: actions/upload-artifact@v3
      with:
        name: BeastRender-JAR
        path: build/libs/*.jar
